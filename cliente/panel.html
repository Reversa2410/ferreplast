<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1F5673">
  <title>Ferreplast · Panel del dueño</title>
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="estilos.css">
</head>
<body class="panel">
  <!--
    El panel del duenio: las dos tiendas juntas. A diferencia del punto de
    venta, no trabaja sin conexion: todo lo que muestra es del servidor, y un
    numero viejo presentado como actual es peor que ninguno.
  -->
  <div id="app" aria-live="polite"></div>
  <div id="modal" class="modal" hidden></div>
  <div id="aviso" class="aviso" role="status" hidden></div>
  <noscript>El panel necesita JavaScript.</noscript>
  <script type="module" src="panel.js"></script>
</body>
</html>
