<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F5673">
  <title>Ferreplast · Punto de venta</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <!--
    Todo se dibuja desde app.js. La pagina tiene que abrir sin senial (la sirve
    el service worker) y sin depender de nada de afuera: ni tipografias de
    Google ni librerias de un CDN, que justo sin internet no cargarian.
  -->
  <div id="app" aria-live="polite"></div>
  <div id="modal" class="modal" hidden></div>
  <div id="aviso" class="aviso" role="status" hidden></div>
  <noscript>El punto de venta necesita JavaScript.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
