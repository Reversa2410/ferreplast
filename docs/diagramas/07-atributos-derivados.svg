<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-label="Atributos derivados: el stock es la suma de los movimientos de inventario, y el saldo de un cliente es lo fiado menos lo abonado. Ninguno de los dos se escribe a mano.">
  <title>Atributos derivados: stock y saldo del cliente</title>
  <rect x="0" y="0" width="960" height="510" fill="#FFFFFF"/>
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#A8551F"/>
    </marker>
  </defs>
  <rect fill="#E7EBEF" stroke="#C9D2DA" stroke-width="1" x="20" y="20" width="380" height="290"/>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="10.5" fill="#66727E" letter-spacing="1" x="36" y="44">MOVIMIENTO_INVENTARIO</text>
  <rect fill="#FFFFFF" stroke="#1F5673" stroke-width="1.6" x="44" y="60" width="332" height="34"/>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="60" y="81">entrada</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" font-weight="600" fill="#1F5673" x="360" y="81" text-anchor="end">+1500</text>
  <rect fill="#FFFFFF" stroke="#1F5673" stroke-width="1.6" x="44" y="108" width="332" height="34"/>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="60" y="129">venta</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" font-weight="600" fill="#1F5673" x="360" y="129" text-anchor="end">−50</text>
  <rect fill="#FFFFFF" stroke="#1F5673" stroke-width="1.6" x="44" y="156" width="332" height="34"/>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="60" y="177">venta (sin conexión)</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" font-weight="600" fill="#1F5673" x="360" y="177" text-anchor="end">−8</text>
  <rect fill="#FFFFFF" stroke="#1F5673" stroke-width="1.6" x="44" y="204" width="332" height="34"/>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="60" y="225">merma</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" font-weight="600" fill="#1F5673" x="360" y="225" text-anchor="end">−2</text>
  <rect fill="#FFFFFF" stroke="#1F5673" stroke-width="1.6" x="44" y="252" width="332" height="34"/>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="60" y="273">ajuste (conteo físico)</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" font-weight="600" fill="#1F5673" x="360" y="273" text-anchor="end">+2</text>
  <line stroke="#2F6B4F" stroke-width="1.5" x1="400" y1="165" x2="480" y2="165"/>
  <circle fill="#E1EFE7" stroke="#2F6B4F" stroke-width="1.5" cx="510" cy="165" r="30"/>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-weight="700" letter-spacing="0.8" x="510" y="175" text-anchor="middle" font-size="24" fill="#2F6B4F">Σ</text>
  <line stroke="#2F6B4F" stroke-width="1.5" x1="540" y1="165" x2="640" y2="165"/>
  <ellipse fill="#E1EFE7" stroke="#2F6B4F" stroke-width="1.3" stroke-dasharray="5 3" cx="790" cy="165" rx="145" ry="38"/>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#2F6B4F" font-style="italic" x="790" y="160" text-anchor="middle">Stock.cantidad</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#2F6B4F" font-style="italic" x="790" y="178" text-anchor="middle">= 1442</text>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="790" y="232" text-anchor="middle">atributo derivado</text>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="790" y="250" text-anchor="middle">lo mantiene un disparador para consultar rápido</text>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="790" y="268" text-anchor="middle">la verdad sigue siendo la suma de movimientos</text>
  <rect fill="#E7EBEF" stroke="#C9D2DA" stroke-width="1" x="20" y="340" width="380" height="150"/>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="10.5" fill="#66727E" letter-spacing="1" x="36" y="364">VENTA (a crédito) y PAGO_CREDITO</text>
  <rect fill="#FFFFFF" stroke="#1F5673" stroke-width="1.6" x="44" y="380" width="332" height="34"/>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="60" y="401">ventas fiadas, no anuladas</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" font-weight="600" fill="#1F5673" x="360" y="401" text-anchor="end">+820</text>
  <rect fill="#FFFFFF" stroke="#1F5673" stroke-width="1.6" x="44" y="428" width="332" height="34"/>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="60" y="449">abonos del cliente</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" font-weight="600" fill="#1F5673" x="360" y="449" text-anchor="end">−300</text>
  <line stroke="#2F6B4F" stroke-width="1.5" x1="400" y1="415" x2="480" y2="415"/>
  <circle fill="#E1EFE7" stroke="#2F6B4F" stroke-width="1.5" cx="510" cy="415" r="30"/>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-weight="700" letter-spacing="0.8" x="510" y="425" text-anchor="middle" font-size="24" fill="#2F6B4F">Σ</text>
  <line stroke="#2F6B4F" stroke-width="1.5" x1="540" y1="415" x2="640" y2="415"/>
  <ellipse fill="#E1EFE7" stroke="#2F6B4F" stroke-width="1.3" stroke-dasharray="5 3" cx="790" cy="415" rx="145" ry="38"/>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#2F6B4F" font-style="italic" x="790" y="410" text-anchor="middle">CLIENTE.saldo</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#2F6B4F" font-style="italic" x="790" y="428" text-anchor="middle">= 520</text>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="790" y="476" text-anchor="middle">no se guarda: lo calcula v_cuentas_por_cobrar</text>
</svg>
