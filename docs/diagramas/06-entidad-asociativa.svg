<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Entidades asociativas: STOCK resuelve la relacion muchos a muchos entre tienda y producto, con la cantidad derivada y el minimo como atributos propios; USUARIO_TIENDA resuelve la de usuario y tienda.">
