<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-label="Especializacion total y disjunta de USUARIO en ADMINISTRADOR y EMPLEADO. Se implementa en una sola tabla con la columna rol como discriminante; la restriccion CK_USUARIO_CREDENCIALES exige las credenciales de cada subtipo.">
  <title>Especializacion total y disjunta de USUARIO</title>
  <rect x="0" y="0" width="920" height="470" fill="#FFFFFF"/>
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#A8551F"/>
    </marker>
  </defs>
  <!-- USUARIO -->
  <rect fill="#FFFFFF" stroke="#1F5673" stroke-width="1.6" x="330" y="56" width="260" height="74"/>
  <rect fill="#E2EDF3" stroke="#1F5673" stroke-width="1.6" x="330" y="30" width="260" height="26"/>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-weight="700" font-size="14" fill="#12181F" letter-spacing="0.6" x="460" y="48" text-anchor="middle">USUARIO</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#12181F" font-weight="600" text-decoration="underline" x="344" y="75">id</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="344" y="91">nombre, activo</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="344" y="107">rol (discriminante)</text>
  <!-- ADMINISTRADOR -->
  <rect fill="#FFFFFF" stroke="#1F5673" stroke-width="1.6" x="80" y="326" width="300" height="74"/>
  <rect fill="#E2EDF3" stroke="#1F5673" stroke-width="1.6" x="80" y="300" width="300" height="26"/>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-weight="700" font-size="14" fill="#12181F" letter-spacing="0.6" x="230" y="318" text-anchor="middle">ADMINISTRADOR</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="94" y="345">email, password_hash</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#2F6B4F" font-style="italic" x="94" y="361">sin filas en USUARIO_TIENDA</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#2F6B4F" font-style="italic" x="94" y="377">ve las dos tiendas</text>
  <!-- EMPLEADO -->
  <rect fill="#FFFFFF" stroke="#1F5673" stroke-width="1.6" x="540" y="326" width="300" height="74"/>
  <rect fill="#E2EDF3" stroke="#1F5673" stroke-width="1.6" x="540" y="300" width="300" height="26"/>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-weight="700" font-size="14" fill="#12181F" letter-spacing="0.6" x="690" y="318" text-anchor="middle">EMPLEADO</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="554" y="345">pin_hash</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#2F6B4F" font-style="italic" x="554" y="361">una o mas filas en USUARIO_TIENDA</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#2F6B4F" font-style="italic" x="554" y="377">opera la tienda de su sesion</text>
  <line stroke="#A8551F" stroke-width="1.6" fill="none" x1="457" y1="130" x2="457" y2="162"/>
  <line stroke="#A8551F" stroke-width="1.6" fill="none" x1="463" y1="130" x2="463" y2="162"/>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="488" y="174">total: todo usuario es uno de los dos</text>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="488" y="190">disjunta: nunca los dos a la vez</text>
  <circle fill="#F6E8DC" stroke="#A8551F" stroke-width="1.5" cx="460" cy="178" r="16"/>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" font-weight="600" fill="#A8551F" x="460" y="182" text-anchor="middle">d</text>
  <line stroke="#A8551F" stroke-width="1.6" fill="none" x1="460" y1="194" x2="460" y2="202"/>
  <polygon fill="#F6E8DC" stroke="#A8551F" stroke-width="1.5" points="460,202 430,230 490,230"/>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" font-weight="600" fill="#A8551F" x="460" y="225" text-anchor="middle">ISA</text>
  <line stroke="#A8551F" stroke-width="1.6" fill="none" x1="460" y1="230" x2="460" y2="270"/>
  <line stroke="#A8551F" stroke-width="1.6" fill="none" x1="230" y1="270" x2="690" y2="270"/>
  <line stroke="#A8551F" stroke-width="1.6" fill="none" x1="230" y1="270" x2="230" y2="300"/>
  <line stroke="#A8551F" stroke-width="1.6" fill="none" x1="690" y1="270" x2="690" y2="300"/>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="460" y="450" text-anchor="middle">Una sola tabla Usuario: rol es el discriminante y CK_USUARIO_CREDENCIALES exige las credenciales de cada subtipo</text>
</svg>
