<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-label="CATEGORIA se relaciona consigo misma: una categoria puede contener otras, y padre_id apunta a la que la contiene.">
  <title>Relacion recursiva de CATEGORIA</title>
  <rect x="0" y="0" width="520" height="300" fill="#FFFFFF"/>
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#A8551F"/>
    </marker>
  </defs>
  <!-- CATEGORIA -->
  <rect fill="#FFFFFF" stroke="#1F5673" stroke-width="1.6" x="60" y="136" width="240" height="74"/>
  <rect fill="#E2EDF3" stroke="#1F5673" stroke-width="1.6" x="60" y="110" width="240" height="26"/>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-weight="700" font-size="14" fill="#12181F" letter-spacing="0.6" x="180" y="128" text-anchor="middle">CATEGORIA</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#12181F" font-weight="600" text-decoration="underline" x="74" y="155">id</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="74" y="171">nombre</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="74" y="187">padre_id (FK)</text>
  <path stroke="#A8551F" stroke-width="1.6" fill="none" d="M300,160 H410 V50 H180 V110" marker-end="url(#mb)"/>
  <polygon fill="#FFFFFF" stroke="#1F5673" stroke-width="1.5" points="410,62 450,95 410,128 370,95"/>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="410" y="99" text-anchor="middle">contiene</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" font-weight="600" fill="#A8551F" x="316" y="152">0..1</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" font-weight="600" fill="#A8551F" x="190" y="100">N</text>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="270" y="270" text-anchor="middle">Plomería contiene Tuberías PVC · padre_id NULL = primer nivel</text>
</svg>
