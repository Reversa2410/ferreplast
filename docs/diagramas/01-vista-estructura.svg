<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-label="Vista de estructura: el negocio agrupa tiendas, usuarios, categorías y productos; el stock resuelve la relación muchos a muchos entre tienda y producto; cada tienda tiene dispositivos que registran bitácora de sincronización.">
  <title>Vista de estructura: negocio, catalogo e inventario</title>
  <rect x="0" y="0" width="1180" height="760" fill="#FFFFFF"/>
        <defs>
          <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#1F5673"/>
          </marker>
          <marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#A8551F"/>
          </marker>
        </defs>

        <!-- NEGOCIO -->
        <rect fill="#E2EDF3" stroke="#1F5673" stroke-width="1.6" x="470" y="26" width="220" height="26"/>
        <rect fill="#FFFFFF" stroke="#1F5673" stroke-width="1.6" x="470" y="52" width="220" height="60"/>
        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-weight="700" font-size="14" fill="#12181F" letter-spacing="0.6" x="580" y="45" text-anchor="middle">NEGOCIO</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#12181F" font-weight="600" text-decoration="underline" x="484" y="71">id</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="484" y="87">nombre, propietario</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="484" y="103">moneda, activo</text>

        <!-- CATEGORIA -->
        <rect fill="#E2EDF3" stroke="#1F5673" stroke-width="1.6" x="60" y="212" width="200" height="26"/>
        <rect fill="#FFFFFF" stroke="#1F5673" stroke-width="1.6" x="60" y="238" width="200" height="60"/>
        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-weight="700" font-size="14" fill="#12181F" letter-spacing="0.6" x="160" y="231" text-anchor="middle">CATEGORIA</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#12181F" font-weight="600" text-decoration="underline" x="74" y="257">id</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="74" y="273">nombre</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="74" y="289">padre_id (FK)</text>

        <!-- TIENDA -->
        <rect fill="#E2EDF3" stroke="#1F5673" stroke-width="1.6" x="470" y="212" width="220" height="26"/>
        <rect fill="#FFFFFF" stroke="#1F5673" stroke-width="1.6" x="470" y="238" width="220" height="76"/>
        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-weight="700" font-size="14" fill="#12181F" letter-spacing="0.6" x="580" y="231" text-anchor="middle">TIENDA</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#12181F" font-weight="600" text-decoration="underline" x="484" y="257">id</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="484" y="273">nombre, tipo</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="484" y="289">direccion, prefijo</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="484" y="305">negocio_id (FK)</text>

        <!-- USUARIO -->
