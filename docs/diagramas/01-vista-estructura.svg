        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-weight="700" font-size="14" fill="#12181F" letter-spacing="0.6" x="425" y="433" text-anchor="middle">STOCK</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#12181F" font-weight="600" text-decoration="underline" x="344" y="459">tienda_id+producto_id</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#2F6B4F" font-style="italic" x="344" y="475">cantidad (derivado)</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="344" y="491">cantidad_minima</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="344" y="507">updated_at</text>

        <!-- DISPOSITIVO -->
        <rect fill="#E2EDF3" stroke="#1F5673" stroke-width="1.6" x="770" y="470" width="210" height="26"/>
        <rect fill="#FFFFFF" stroke="#1F5673" stroke-width="1.6" x="770" y="496" width="210" height="60"/>
        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-weight="700" font-size="14" fill="#12181F" letter-spacing="0.6" x="875" y="489" text-anchor="middle">DISPOSITIVO</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#12181F" font-weight="600" text-decoration="underline" x="784" y="515">id</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="784" y="531">nombre</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="784" y="547">ultimo_sync</text>

        <!-- SYNC_LOG -->
        <rect fill="#E2EDF3" stroke="#1F5673" stroke-width="1.6" x="770" y="632" width="210" height="26"/>
        <rect fill="#FFFFFF" stroke="#1F5673" stroke-width="1.6" x="770" y="658" width="210" height="60"/>
        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-weight="700" font-size="14" fill="#12181F" letter-spacing="0.6" x="875" y="651" text-anchor="middle">SYNC_LOG</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#12181F" font-weight="600" text-decoration="underline" x="784" y="677">id</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="784" y="693">registros_enviados</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="784" y="709">registros_duplicados</text>

        <!-- R1 NEGOCIO -> TIENDA -->
        <path stroke="#1F5673" stroke-width="1.4" fill="none" d="M580,112 V212" marker-end="url(#fa)"/>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" font-weight="600" fill="#1F5673" x="590" y="152">1 : N</text>
        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="590" y="168">posee</text>

        <!-- R4 NEGOCIO -> CATEGORIA -->
        <path stroke="#1F5673" stroke-width="1.4" fill="none" d="M470,66 H120 V212" marker-end="url(#fa)"/>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" font-weight="600" fill="#1F5673" x="200" y="58">1 : N</text>
        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="248" y="58">clasifica</text>

        <!-- R2 NEGOCIO -> USUARIO -->
        <path stroke="#1F5673" stroke-width="1.4" fill="none" d="M690,66 H1010 V212" marker-end="url(#fa)"/>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" font-weight="600" fill="#1F5673" x="800" y="58">1 : N</text>
        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="848" y="58">emplea</text>

        <!-- R6 NEGOCIO -> PRODUCTO -->
        <path stroke="#1F5673" stroke-width="1.4" fill="none" d="M470,96 H24 V478 H60" marker-end="url(#fa)"/>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" font-weight="600" fill="#1F5673" x="30" y="256" transform="rotate(-90 30 256)">1 : N</text>
        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="30" y="322" transform="rotate(-90 30 322)">oferta</text>

        <!-- R5 CATEGORIA recursiva -->
        <path stroke="#A8551F" stroke-width="1.6" fill="none" d="M260,254 H296 V196 H200 V212" marker-end="url(#fb)"/>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" font-weight="600" fill="#A8551F" x="304" y="230">1 : N</text>
        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="304" y="246">contiene</text>

        <!-- R7 CATEGORIA -> PRODUCTO -->
        <path stroke="#1F5673" stroke-width="1.4" fill="none" d="M160,298 V414" marker-end="url(#fa)"/>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" font-weight="600" fill="#1F5673" x="170" y="348">0 : N</text>
        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="170" y="364">agrupa</text>

        <!-- R8a PRODUCTO -> STOCK -->
        <path stroke="#A8551F" stroke-width="1.6" fill="none" d="M260,478 H330" marker-end="url(#fb)"/>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" font-weight="600" fill="#A8551F" x="272" y="470">1 : N</text>

        <!-- R8b TIENDA -> STOCK -->
        <path stroke="#A8551F" stroke-width="1.6" fill="none" d="M530,314 V478 H520" marker-end="url(#fb)"/>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" font-weight="600" fill="#A8551F" x="540" y="400">1 : N</text>
        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="540" y="416">almacena</text>

        <!-- R21 TIENDA -> DISPOSITIVO -->
        <path stroke="#1F5673" stroke-width="1.4" fill="none" d="M690,272 H730 V526 H770" marker-end="url(#fa)"/>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" font-weight="600" fill="#1F5673" x="700" y="264">1 : N</text>
        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="740" y="500">instala</text>

        <!-- R22 DISPOSITIVO -> SYNC_LOG -->
        <path stroke="#1F5673" stroke-width="1.4" fill="none" d="M875,556 V632" marker-end="url(#fa)"/>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" font-weight="600" fill="#1F5673" x="885" y="588">1 : N</text>
        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="885" y="604">bitácora</text>
      </svg>
