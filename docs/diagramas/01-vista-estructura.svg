        <rect fill="#FFFFFF" stroke="#1F5673" stroke-width="1.6" x="900" y="238" width="220" height="76"/>
        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-weight="700" font-size="14" fill="#12181F" letter-spacing="0.6" x="1010" y="231" text-anchor="middle">USUARIO</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#12181F" font-weight="600" text-decoration="underline" x="914" y="257">id</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="914" y="273">nombre, rol</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="914" y="289">email, pin_hash</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="914" y="305">tienda_id (FK)</text>

        <!-- ISA stub -->
        <line stroke="#A8551F" stroke-width="1.6" fill="none" x1="1010" y1="314" x2="1010" y2="344"/>
        <polygon points="1010,344 1042,382 978,382" fill="#F6E8DC" stroke="#A8551F" stroke-width="1.5"/>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-weight="600" fill="#A8551F" x="1010" y="371" text-anchor="middle" font-size="10">ISA</text>
        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="1010" y="400" text-anchor="middle">especialización &rarr; Fig. 3</text>

        <!-- PRODUCTO -->
        <rect fill="#E2EDF3" stroke="#1F5673" stroke-width="1.6" x="60" y="414" width="200" height="26"/>
        <rect fill="#FFFFFF" stroke="#1F5673" stroke-width="1.6" x="60" y="440" width="200" height="76"/>
        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-weight="700" font-size="14" fill="#12181F" letter-spacing="0.6" x="160" y="433" text-anchor="middle">PRODUCTO</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#12181F" font-weight="600" text-decoration="underline" x="74" y="459">id</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="74" y="475">codigo, nombre</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="74" y="491">precio_costo/venta</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="74" y="507">unidad_medida</text>

