<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="720" viewBox="0 0 1820 720" role="img" aria-label="Vista de estructura del modelo: el negocio posee las tiendas, emplea a los usuarios y da credito a los clientes. El catalogo es unico; STOCK resuelve la relacion muchos a muchos entre tienda y producto, y USUARIO_TIENDA la de usuario y tienda. CATEGORIA se contiene a si misma.">
  <title>Vista de estructura: negocio, catalogo y personas</title>
  <rect x="0" y="0" width="1820" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F5673"/>
    </marker>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#A8551F"/>
    </marker>
  </defs>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#12181F" letter-spacing="0.8" x="40" y="48">Vista de estructura</text>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="16" font-weight="500" fill="#3D4954" x="40" y="72">Negocio, tiendas, catálogo y personas</text>
  <line stroke="#C9D2DA" stroke-width="1" x1="60" y1="654" x2="1760" y2="654"/>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="10.5" fill="#66727E" letter-spacing="1" x="60" y="672">LEYENDA</text>
  <rect fill="#FFFFFF" stroke="#1F5673" stroke-width="1.6" x="60" y="684" width="34" height="22"/>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="12.5" font-weight="500" fill="#3D4954" x="106" y="700">Entidad fuerte</text>
  <rect fill="#F6E8DC" stroke="#A8551F" stroke-width="1.6" x="238" y="684" width="34" height="22"/>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="12.5" font-weight="500" fill="#3D4954" x="284" y="700">Entidad asociativa</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#2F6B4F" font-style="italic" x="444" y="699">attr</text>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="12.5" font-weight="500" fill="#3D4954" x="490" y="700">Atributo derivado o calculado</text>
  <line stroke="#1F5673" stroke-width="1.4" fill="none" x1="727" y1="695" x2="761" y2="695" marker-end="url(#ma)"/>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="12.5" font-weight="500" fill="#3D4954" x="773" y="700">Relación 1:N (la flecha apunta al lado N)</text>
  <line stroke="#A8551F" stroke-width="1.6" fill="none" x1="1094" y1="695" x2="1128" y2="695" marker-end="url(#mb)"/>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="12.5" font-weight="500" fill="#3D4954" x="1140" y="700">Construcción extendida</text>
