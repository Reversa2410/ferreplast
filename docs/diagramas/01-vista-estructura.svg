  <rect fill="#F6E8DC" stroke="#A8551F" stroke-width="1.6" x="1140" y="446" width="260" height="54"/>
  <rect fill="#F6E8DC" stroke="#A8551F" stroke-width="1.6" x="1140" y="420" width="260" height="26"/>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-weight="700" font-size="14" fill="#12181F" letter-spacing="0.6" x="1270" y="438" text-anchor="middle">USUARIO_TIENDA</text>
