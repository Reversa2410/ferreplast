<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-label="VENTA_LINEA es entidad debil: su clave es venta_id mas el numero de linea, y depende de VENTA por una relacion identificadora. Borrar la venta borra sus lineas.">
  <title>Entidad debil VENTA_LINEA y relacion identificadora</title>
  <rect x="0" y="0" width="1000" height="290" fill="#FFFFFF"/>
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#A8551F"/>
    </marker>
  </defs>
  <!-- VENTA -->
  <rect fill="#FFFFFF" stroke="#1F5673" stroke-width="1.6" x="40" y="86" width="220" height="74"/>
  <rect fill="#E2EDF3" stroke="#1F5673" stroke-width="1.6" x="40" y="60" width="220" height="26"/>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-weight="700" font-size="14" fill="#12181F" letter-spacing="0.6" x="150" y="78" text-anchor="middle">VENTA</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#12181F" font-weight="600" text-decoration="underline" x="54" y="105">id</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="54" y="121">numero</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="54" y="137">total</text>
  <!-- VENTA_LINEA -->
  <rect fill="#FFFFFF" stroke="#A8551F" stroke-width="1.6" x="700" y="66" width="260" height="104"/>
  <rect fill="#F6E8DC" stroke="#A8551F" stroke-width="1.6" x="700" y="40" width="260" height="26"/>
  <rect fill="none" stroke="#A8551F" stroke-width="1" x="704" y="70" width="252" height="96"/>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-weight="700" font-size="14" fill="#12181F" letter-spacing="0.6" x="830" y="58" text-anchor="middle">VENTA_LINEA</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#12181F" font-weight="600" text-decoration="underline" x="714" y="85">venta_id + numero</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="714" y="101">cantidad</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="714" y="117">precio_unitario</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="714" y="133">descuento</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="714" y="149">subtotal</text>
  <line stroke="#A8551F" stroke-width="1.6" fill="none" x1="260" y1="112" x2="385" y2="112"/>
  <polygon fill="#F6E8DC" stroke="#A8551F" stroke-width="1.5" points="385,112 480,67 575,112 480,157"/>
  <polygon fill="none" stroke="#A8551F" stroke-width="1" points="400,112 480,75 560,112 480,149"/>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="480" y="108" text-anchor="middle">DETALLA</text>
  <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" font-weight="600" fill="#A8551F" x="480" y="126" text-anchor="middle">1 : N</text>
  <line stroke="#A8551F" stroke-width="1.6" fill="none" x1="575" y1="112" x2="700" y2="112" marker-end="url(#mb)"/>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="150" y="230" text-anchor="middle">entidad fuerte</text>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="480" y="230" text-anchor="middle">relación identificadora</text>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="830" y="230" text-anchor="middle">entidad débil</text>
  <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="500" y="268" text-anchor="middle">borrar la venta borra sus líneas — ON DELETE CASCADE</text>
</svg>
