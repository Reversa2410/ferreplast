<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260" role="img" aria-label="La venta se relaciona con venta línea mediante una relación identificadora dibujada con doble rombo; venta línea es entidad débil, con doble rectángulo.">
  <title>Entidad debil VENTA_LINEA y relacion identificadora</title>
  <rect x="0" y="0" width="860" height="260" fill="#FFFFFF"/>
        <defs>
          <marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#A8551F"/>
          </marker>
        </defs>

        <rect fill="#E2EDF3" stroke="#1F5673" stroke-width="1.6" x="40" y="86" width="180" height="26"/>
        <rect fill="#FFFFFF" stroke="#1F5673" stroke-width="1.6" x="40" y="112" width="180" height="60"/>
        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-weight="700" font-size="14" fill="#12181F" letter-spacing="0.6" x="130" y="105" text-anchor="middle">VENTA</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#12181F" font-weight="600" text-decoration="underline" x="54" y="131">id</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="54" y="147">numero</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="54" y="163">total</text>

        <line stroke="#A8551F" stroke-width="1.6" fill="none" x1="220" y1="138" x2="330" y2="138"/>

        <!-- rombo identificador: doble -->
        <polygon fill="#F6E8DC" stroke="#A8551F" stroke-width="1.5" points="430,96 530,138 430,180 330,138"/>
        <polygon points="430,106 516,138 430,170 344,138" fill="none" stroke="#A8551F" stroke-width="1.1"/>
        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-weight="500" fill="#66727E" x="430" y="136" text-anchor="middle" font-size="12">DETALLA</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" font-weight="600" fill="#A8551F" x="430" y="152" text-anchor="middle">1 : N</text>

        <line stroke="#A8551F" stroke-width="1.6" fill="none" x1="530" y1="138" x2="620" y2="138" marker-end="url(#ha)"/>

        <rect fill="#F6E8DC" stroke="#A8551F" stroke-width="1.6" x="640" y="80" width="200" height="26"/>
        <rect fill="#FFFFFF" stroke="#A8551F" stroke-width="1.6" x="640" y="106" width="200" height="76"/>
        <rect x="644" y="110" width="192" height="68" fill="none" stroke="#A8551F" stroke-width="1"/>
        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-weight="700" font-size="14" fill="#12181F" letter-spacing="0.6" x="740" y="99" text-anchor="middle">VENTA_LINEA</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#12181F" font-weight="600" text-decoration="underline" x="656" y="129">venta_id + nro</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="656" y="145">cantidad</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="656" y="161">precio_unitario</text>
        <text font-family="'IBM Plex Mono','Consolas','Courier New',monospace" font-size="11" fill="#3D4954" x="656" y="177">subtotal</text>

        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="130" y="212" text-anchor="middle">entidad fuerte</text>
        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="430" y="212" text-anchor="middle">relación identificadora</text>
        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="740" y="212" text-anchor="middle">entidad débil</text>

        <text font-family="'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',sans-serif" font-size="11.5" font-weight="500" fill="#66727E" x="430" y="240" text-anchor="middle">borrar la venta borra sus líneas — ON DELETE CASCADE</text>
      </svg>
